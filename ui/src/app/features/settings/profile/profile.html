<div class="page">
  <div class="page__header">
    <h1 class="page__title">My Business</h1>
    <p class="page__subtitle">Your business profile used in AI-drafted emails</p>
  </div>

  <div style="display:grid; grid-template-columns:1fr 360px; gap:24px;">
    <form [formGroup]="form">
      <div class="section-card">
        <p class="section-card__title">Business Details</p>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
          <div class="field">
            <label class="field__label">Business Name</label>
            <input type="text" class="field__input" formControlName="biz_name" />
          </div>
          <div class="field">
            <label class="field__label">Your Full Name</label>
            <input type="text" class="field__input" formControlName="full_name" />
          </div>
          <div class="field">
            <label class="field__label">Your Role / Title</label>
            <input type="text" class="field__input" formControlName="role" />
          </div>
          <div class="field">
            <label class="field__label">Website</label>
            <input type="text" class="field__input" formControlName="website" />
          </div>
          <div class="field">
            <label class="field__label">Phone</label>
            <input type="text" class="field__input" formControlName="phone" />
          </div>
        </div>

        <div class="field" style="margin-top:4px;">
          <label class="field__label">Your Offering</label>
          <input type="text" class="field__input" formControlName="offering" placeholder="e.g. web design services" />
        </div>
        <div class="field">
          <label class="field__label">Key Benefits</label>
          <textarea class="field__textarea" formControlName="benefits" placeholder="What problems do you solve? What results do you deliver?" style="min-height:80px;"></textarea>
        </div>

        <div style="display:flex; align-items:center; gap:12px; margin-top:4px;">
          <button type="button" class="btn btn--primary" (click)="save()" [disabled]="saving()">
            {{ saving() ? 'Saving…' : 'Save Profile' }}
          </button>
          @if (saved()) {
            <span style="font-size:13px; color:hsl(var(--success))">✓ Saved</span>
          }
        </div>
      </div>
    </form>

    <!-- Signature preview -->
    <div class="section-card" style="height:fit-content;">
      <p class="section-card__title">Email Signature Preview</p>
      @if (signature()) {
        <pre style="font-size:13px; color:hsl(var(--foreground)); white-space:pre-wrap; margin:0; font-family:inherit;">{{ signature() }}</pre>
      } @else {
        <p style="font-size:13px; color:hsl(var(--muted))">Fill in your details to see the signature preview.</p>
      }
    </div>
  </div>
</div>
