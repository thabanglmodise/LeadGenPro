<div class="auth">
  <div class="auth__card">
    <div class="auth__logo">
      <div class="auth__logo-mark">P</div>
    </div>
    <h1 class="auth__title">Check your email</h1>

    @if (advancing()) {
      <p class="auth__subtitle">Verifying your account…</p>
    } @else {
      <p class="auth__subtitle">
        We sent a verification link to
        <strong style="color: hsl(var(--foreground))">{{ auth.user()?.email }}</strong>.
        Click the link to activate your account.
      </p>
    }

    @if (error()) {
      <div class="auth__error">{{ error() }}</div>
    }

    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
      <button class="auth__btn" (click)="resendVerification()" [disabled]="advancing()">
        Resend verification email
      </button>
      <button
        class="auth__btn"
        style="background: hsl(var(--bg-3)); color: hsl(var(--muted)); border: 1px solid hsl(var(--border));"
        (click)="signOut()"
      >
        Sign out
      </button>
    </div>

    <div class="auth__links" style="margin-top: 16px; justify-content: center;">
      <a routerLink="/auth/login">← Back to sign in</a>
    </div>
  </div>
</div>
